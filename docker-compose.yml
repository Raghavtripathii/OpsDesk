services:
  db:
    image: postgres:16-alpine
    container_name: opsdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsdesk}
      POSTGRES_DB: ${POSTGRES_DB:-opsdesk}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - opsdesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsdesk} -d ${POSTGRES_DB:-opsdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsdesk-pgdata: